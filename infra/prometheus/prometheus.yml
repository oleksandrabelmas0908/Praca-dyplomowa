# Interval, timeout and retention are measurement decisions, see docs/PLAN.md
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml
  - /etc/prometheus/alerts.yml

scrape_configs:
  # One container each: a stopped one stays listed and reports up 0
  - job_name: catalog
    static_configs:
      - targets: ["catalog:8000"]
  - job_name: orders
    static_configs:
      - targets: ["orders:8000"]
  - job_name: billing
    static_configs:
      - targets: ["billing:8000"]

  # Scaled with replicas: Compose DNS returns one address per container, and each becomes its own
  # target with instance <ip>:<port>. A static target would reach one random replica per scrape
  - job_name: inventory
    dns_sd_configs:
      - names: ["inventory"]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: payments
    dns_sd_configs:
      - names: ["payments"]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: billing-worker
    dns_sd_configs:
      - names: ["billing-worker"]
        type: A
        port: 9000
        refresh_interval: 5s

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # One exporter, two targets: the Redis address goes in ?target=, and instance becomes
  # redis-cache or redis-broker
  - job_name: redis
    metrics_path: /scrape
    static_configs:
      - targets: ["redis://redis-cache:6379", "redis://redis-broker:6379"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        regex: redis://(.+):6379
        target_label: instance
      - target_label: __address__
        replacement: redis-exporter:9121
