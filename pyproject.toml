[project]
name = "praca-dyplomowa"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "prometheus-client==0.26.0",
    "sqlalchemy[asyncio]==2.0.54",
    "asyncpg==0.31.0",
    "psycopg2-binary==2.9.13",
    "redis==8.1.0",
    "alembic==1.20.0",
    "aiokafka==0.14.0",
    # Without the [redis] extra: kombu's extra caps redis-py below 6.5, the pin above is 8.1
    "celery==5.6.3",
    "pillow==12.3.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shared"]

[tool.ruff]
line-length = 100
# `pip install .` in the image leaves a copy of shared/ there, which would be linted twice
extend-exclude = ["build"]

[tool.mypy]
# Without it mypy reads Settings() as missing every field that pydantic-settings fills from env
plugins = ["pydantic.mypy"]

# aiokafka has inline annotations but no py.typed marker
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
follow_untyped_imports = true

# celery has no py.typed marker
[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
