# Interval, timeout and retention are measurement decisions, see docs/PLAN.md
global:
  scrape_interval: 5s
  scrape_timeout: 3s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # One container each: a stopped one stays listed and reports up 0
  - job_name: catalog
    static_configs:
      - targets: ["catalog:8000"]
  - job_name: orders
    static_configs:
      - targets: ["orders:8000"]
  - job_name: billing
    static_configs:
      - targets: ["billing:8000"]

  # Scaled with replicas: Compose DNS returns one address per container, and each becomes its own
  # target with instance <ip>:<port>. A static target would reach one random replica per scrape
  - job_name: inventory
    dns_sd_configs:
      - names: ["inventory"]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: payments
    dns_sd_configs:
      - names: ["payments"]
        type: A
        port: 8000
        refresh_interval: 5s
  - job_name: catalog-worker
    dns_sd_configs:
      - names: ["catalog-worker"]
        type: A
        port: 9000
        refresh_interval: 5s
  - job_name: billing-worker
    dns_sd_configs:
      - names: ["billing-worker"]
        type: A
        port: 9000
        refresh_interval: 5s
