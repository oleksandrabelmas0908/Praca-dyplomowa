# The built-in collectors count locks held, not sessions waiting for one. Row lock waits are
# transaction ID locks, which pg_locks_count leaves out because they have no database
pg_backends:
  query: "SELECT count(*) AS waiting_for_lock FROM pg_stat_activity WHERE wait_event_type = 'Lock' AND datname = current_database()"
  metrics:
    - waiting_for_lock:
        usage: GAUGE
        description: Sessions waiting for a lock at the moment of the scrape
