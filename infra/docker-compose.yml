services:
  postgres:
    image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae  # 18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - shop
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  kafka:
    image: apache/kafka@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837  # 4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./infra/kafka/log4j2.yaml:/mnt/shared/config/log4j2.yaml:ro
    networks:
      - shop
    cpus: 2.0
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx64m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5m
      timeout: 10s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # Exists only to run migrations, not part of the main application stack. `make up` runs it once,
  # after Postgres is healthy and before the services start.
  migrate:
    build:
      context: .
      dockerfile: infra/Dockerfile
      target: migrate
    # The profile keeps it out of `docker compose up`, `make up` runs it explicitly
    profiles:
      - migrate
    environment:
      SERVICE_NAME: migrate
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    cpus: 1.0
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: catalog
    ports:
      - "${CATALOG_PORT}:8000"
    environment:
      SERVICE_NAME: catalog
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  orders:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: orders
    ports:
      - "${ORDERS_PORT}:8000"
    environment:
      SERVICE_NAME: orders
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  inventory:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: inventory
    ports:
      - "${INVENTORY_PORT}:8000"
    environment:
      SERVICE_NAME: inventory
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  payments:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: payments
    ports:
      - "${PAYMENTS_PORT}:8000"
    environment:
      SERVICE_NAME: payments
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

  billing:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: billing
    ports:
      - "${BILLING_PORT}:8000"
    environment:
      SERVICE_NAME: billing
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    networks:
      - shop
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5m
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 1s

networks:
  shop:

volumes:
  postgres_data:
  kafka_data:
