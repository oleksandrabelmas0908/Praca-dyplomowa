services:
  catalog:
    build:
      context: .
      dockerfile: infra/Dockerfile
      args:
        SERVICE: catalog
    ports:
      - "${CATALOG_PORT}:8000"
    environment:
      SERVICE_NAME: catalog
      LOG_LEVEL: ${LOG_LEVEL}
      ENV: ${ENV}
    networks:
      - shop
    cpus: 1.0
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

