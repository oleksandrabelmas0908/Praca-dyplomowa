# Every configuration the experiments measure. Each entry sets every flag, so an entry is the
# whole configuration and nothing is inherited from .env. An entry shared by several experiments
# lists all of them.
#
# E1  DB driver x Uvicorn workers, cache off so catalog reads reach the database
# E2  cache: off (e1-async-w1), TTL 10 s, TTL 60 s
# E3  transport: kafka (e2-ttl-60), http
# E4  Kafka partitions x inventory and payments replicas
# E5  Celery concurrency of billing-worker
#
# DB_DRIVER=sync with TRANSPORT=http is not here: orders refuses to start with it (TASK-33).

entries:
  - name: e1-async-w1
    experiments: [E1, E2]
    flags:
      DB_DRIVER: async
      UVICORN_WORKERS: 1
      CACHE_ENABLED: false
      CACHE_TTL_SECONDS: 60
      TRANSPORT: kafka
      KAFKA_PARTITIONS: 3
      INVENTORY_REPLICAS: 1
      PAYMENTS_REPLICAS: 1
      CELERY_CONCURRENCY: 2

  - name: e1-sync-w1
    experiments: [E1]
    flags:
      DB_DRIVER: sync
      UVICORN_WORKERS: 1
      CACHE_ENABLED: false
      CACHE_TTL_SECONDS: 60
      TRANSPORT: kafka
      KAFKA_PARTITIONS: 3
      INVENTORY_REPLICAS: 1
      PAYMENTS_REPLICAS: 1
      CELERY_CONCURRENCY: 2

